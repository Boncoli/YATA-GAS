    <script>
        let formElements; // グローバルスコープで宣言

        function toggleEmailInput() {
            const emailContainer = document.getElementById("emailInputContainer");
            const sendEmailFlag = formElements.sendEmailFlag.checked;
            emailContainer.style.display = sendEmailFlag ? "block" : "none";
            formElements.email.required = sendEmailFlag; // メールアドレスを必須にする
        }

        function showStatus(message) {
            document.getElementById("status-overlay").style.display = "flex";
            document.getElementById("status-text").textContent = message;
        }

        function hideStatus() {
            document.getElementById("status-overlay").style.display = "none";
        }

        let statusInterval; // ステータス更新用のインターバルID

        function startStatusPolling() {
            statusInterval = setInterval(() => {
                google.script.run
                    .withSuccessHandler(status => {
                        document.getElementById("status-text").textContent = status;
                    })
                    .getScriptStatus();
            }, 1000); // 1秒ごとにステータスを更新
        }

        function stopStatusPolling() {
            clearInterval(statusInterval);
            google.script.run.clearScriptStatus(); // 処理完了後にステータスをクリア
        }

        function saveSettings() {
            const settings = {
                inputType: document.querySelector('input[name="inputType"]:checked').value, // 追加
                searchWord: formElements.searchWord.value,
                urlInput: formElements.urlInput.value, // 追加
                sourceFlag: formElements.sourceFlag.value,
                startDate: formElements.startDate.value,
                endDate: formElements.endDate.value,
                maxPaperCount: formElements.maxPaperCount.value,
                language: formElements.language.value,
                sendEmailFlag: formElements.sendEmailFlag.checked,
                email: formElements.email.value
            };
            localStorage.setItem("summaryToolSettings", JSON.stringify(settings));
        }

        function loadSettings() {
            const settings = JSON.parse(localStorage.getItem("summaryToolSettings"));
            if (settings) {
                // inputTypeのラジオボタンを復元
                const inputTypeRadio = document.getElementById('inputType' + (settings.inputType === 'url' ? 'Url' : 'Keyword'));
                if (inputTypeRadio) {
                    inputTypeRadio.checked = true;
                    toggleInputType(); // UIの状態を更新
                }

                formElements.searchWord.value = settings.searchWord || "";
                formElements.urlInput.value = settings.urlInput || ""; // 追加
                formElements.sourceFlag.value = settings.sourceFlag || "PubMed";
                formElements.startDate.value = settings.startDate || "";
                formElements.endDate.value = settings.endDate || "";
                formElements.maxPaperCount.value = settings.maxPaperCount || "3";
                formElements.language.value = settings.language || "JP";
                formElements.sendEmailFlag.checked = settings.sendEmailFlag || false;
                formElements.email.value = settings.email || "";
                toggleEmailInput(); // メール入力欄の表示を更新
            }
        }

        function clearForm() {
            document.getElementById("inputTypeKeyword").checked = true; // キーワード検索をデフォルトに
            toggleInputType(); // UIを更新

            formElements.searchWord.value = "";
            formElements.urlInput.value = ""; // 追加
            formElements.sourceFlag.value = "PubMed";
            formElements.maxPaperCount.value = "3";
            formElements.language.value = "JP";
            formElements.sendEmailFlag.checked = false;
            formElements.email.value = "";
            toggleEmailInput();
            setDefaultDates(); // 日付をデフォルトに戻す
            localStorage.removeItem("summaryToolSettings"); // 保存された設定もクリア
        }

        function setDefaultDates() {
            const today = new Date();
            const fourteenDaysAgo = new Date(today);
            fourteenDaysAgo.setDate(today.getDate() - 14);
            const sevenDaysAgo = new Date(today);
            sevenDaysAgo.setDate(today.getDate() - 7);

            formElements.startDate.value = fourteenDaysAgo.toISOString().split('T')[0];
            formElements.endDate.value = sevenDaysAgo.toISOString().split('T')[0];
        }

        function handleRun() {
            // クライアントサイドでの入力検証
            const form = document.getElementById("summaryForm");
            if (!form.checkValidity()) {
                form.reportValidity(); // HTML5のバリデーションメッセージを表示
                return;
            }

            saveSettings(); // 設定を保存

            showStatus("処理を開始しています...");
            startStatusPolling(); // ステータス更新を開始
            document.getElementById("initial-message")?.remove();
            document.getElementById("results-container").innerHTML = "";
            document.getElementById("result-stats").textContent = "";
            document.getElementById("model-used").textContent = "";

            google.script.run
                .withSuccessHandler(function(data) {
                    console.log("Success handler started."); 
                    stopStatusPolling(); 
                    showStatus("結果を準備中..."); 
                    const resultsContainer = document.getElementById("results-container");
                    const summaryResults = data.summaryResults;

                    if (!summaryResults || summaryResults.length === 0) {
                        resultsContainer.innerHTML = `<div class="text-center text-muted mt-5"><p>対象の論文が見つかりませんでした。</p></div>`;
                        hideStatus();
                        return;
                    }
                    
                    document.getElementById("result-stats").textContent = `${summaryResults.length}件の結果`;
                    document.getElementById("model-used").textContent = `使用モデル: ${data.modelUsed}`;

                    // 🌟 新規追加：拡張クエリの表示制御
                    const queryContainer = document.getElementById("expanded-query-container");
                    const queryText = document.getElementById("expanded-query-text");
                    const inputType = document.querySelector('input[name="inputType"]:checked').value;
                    
                    // キーワード検索で、かつ元の入力からAIが文字列を拡張(変更)していたら表示する
                    if (inputType === "keyword" && data.expandedQuery && data.expandedQuery !== formElements.searchWord.value) {
                        queryText.textContent = data.expandedQuery;
                        queryContainer.style.display = "block";
                    } else {
                        queryContainer.style.display = "none";
                    }

                    summaryResults.forEach((item, index) => {
                        const card = `
                            <div class="col-12">
                                <div class="card shadow-sm h-100">
                                    <div class="card-body d-flex flex-column">
                                        <h5 class="card-title">${item.aiSummary.title || item.title || '(タイトルなし)'}</h5>
                                        <div class="text-muted small mb-2">
                                            <span>${item.author || '(著者不明)'}</span> | 
                                            <span>${item.journal || '(掲載誌不明)'}</span> | 
                                            <span>${item.epubDate || '(日付不明)'}</span>
                                        </div>
                                        <div class="ai-summary-box">
                                            ${formatSummary(item.aiSummary, index)}
                                        </div>
                                        <div class="mt-auto pt-3">
                                            ${generateLinks(item)}
                                        
                                    </div>
                                </div>
                            </div>
                        `;
                        resultsContainer.innerHTML += card;
                    });
                    console.log("Finished processing results. Hiding status."); // 追加
                    hideStatus(); // 処理完了
                })
                .withFailureHandler(function(error) {
                    stopStatusPolling(); // ステータス更新を停止
                    hideStatus();
                    const resultsContainer = document.getElementById("results-container");
                    resultsContainer.innerHTML = `<div class="alert alert-danger" role="alert">エラーが発生しました: ${error.message}</div>`;
                })
                .executeScript(
                    document.querySelector('input[name="inputType"]:checked').value, // inputType
                    formElements.searchWord.value,
                    formElements.urlInput.value, // urlInput
                    formElements.startDate.value,
                    formElements.endDate.value,
                    parseInt(formElements.maxPaperCount.value),
                    formElements.sendEmailFlag.checked ? formElements.email.value : "",
                    formElements.language.value,
                    formElements.sendEmailFlag.checked,
                    formElements.sourceFlag.value
                );
        }
        
        function formatSummary(summaryData, index) { // index を引数に追加
            if (typeof summaryData === 'string') {
                // 既存の文字列処理ロジック
                let formattedText = summaryData.trim();
                formattedText = formattedText
                    .replace(/\s*【タイトル】\s*([\s\S]*?)(?=(【tl;dr】|【要約】|$))/g, '<strong>【タイトル】</strong><br>$1<br>')
                    .replace(/\s*【tl;dr】\s*([\s\S]*?)(?=(【要約】|$))/g, '<strong>【tl;dr】</strong><br>$1<br>')
                    .replace(/\s*【要約】\s*([\s\S]*?)(?=(【タイトル】|【tl;dr】|$))/g, '<strong>【要約】</strong><br>$1<br>');
                formattedText = formattedText.replace(/\n/g, '<br>');
                return formattedText;
            } else if (typeof summaryData === 'object' && summaryData !== null) {
                // JSONオブジェクトの場合の処理
                const tldr = summaryData.tldr || '(短縮要約なし)';
                const summary = summaryData.summary || {};
                const keywords = summaryData.keywords || [];

                let html = '';
                // tl;dr セクション
                html += `<div class="tldr-section">
`;
                html += `<strong>【tl;dr】</strong><br>${tldr}<br>`;
                html += `</div>`;

                // 詳細要約セクション（初期非表示）
                const detailSummaryId = `detail-summary-${index}`; // ユニークなIDを生成
                html += `<div id="${detailSummaryId}" class="summary-detail-section mt-3">
`;
                html += `<strong>【要約】</strong><br>`;
                if (summary.background) html += `<strong>背景:</strong> ${summary.background}<br>`;
                if (summary.objective) html += `<strong>目的:</strong> ${summary.objective}<br>`;
                if (summary.methods) html += `<strong>方法:</strong> ${summary.methods}<br>`;
                if (summary.results) html += `<strong>結果:</strong> ${summary.results}<br>`;
                if (summary.conclusion) html += `<strong>結論:</strong> ${summary.conclusion}<br>`;
                
                if (!summary.background && !summary.objective && !summary.methods && !summary.results && !summary.conclusion) {
                    html += '(要約内容なし)';
                }
                html += `</div>`;

                // 展開/折りたたみボタン
                html += `<div class="text-end mt-2">
`;
                html += `<a href="#" class="toggle-summary-btn" data-target="${detailSummaryId}" data-expanded="false">詳細を表示</a>`;
                html += `</div>`;

                // キーワードセクション
                if (keywords.length > 0) {
                    html += `<div class="keywords-section mt-3">
`;
                    html += `<strong>キーワード:</strong> ${keywords.join(', ')}<br>`;
                    html += `</div>`;
                }

                return html;
            }
            return '(要約なし)';
        }

        // 詳細要約の表示/非表示を切り替える関数
        function toggleSummaryDetail(event) {
            event.preventDefault(); // リンクのデフォルト動作をキャンセル
            const button = event.target;
            const targetId = button.dataset.target;
            const targetElement = document.getElementById(targetId);

            if (targetElement) {
                const isExpanded = button.dataset.expanded === 'true';
                if (isExpanded) {
                    targetElement.style.display = 'none';
                    button.textContent = '詳細を表示';
                    button.dataset.expanded = 'false';
                } else {
                    targetElement.style.display = 'block';
                    button.textContent = '詳細を隠す';
                    button.dataset.expanded = 'true';
                }
            }
        }

        // イベントリスナーをresults-containerに追加（イベント委譲）
        document.addEventListener('click', function(event) {
            if (event.target.classList.contains('toggle-summary-btn')) {
                toggleSummaryDetail(event);
            }
        });

        function createLink(label, url) {
            if (!url) return '';
            const icon = {
                'PubMed': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="link-icon"><path d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z"/></svg>',
                'DOI': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="link-icon"><path d="M4.715 6.542 3.343 7.914a.5.5 0 1 0 .707.707l1.372-1.372.001-.001.002-.002.002-.002.001-.001a.5.5 0 0 0 0-.707l-1.373-1.372a.5.5 0 1 0-.707.707l.001.001.002.002.002.002.001.001ZM11.285 9.458l1.372 1.372a.5.5 0 0 0 .707-.707l-1.372-1.372-.001-.001-.002-.002-.002-.002-.001-.001a.5.5 0 0 0 0 .707l1.373 1.372a.5.5 0 0 0 .707-.707l-.001-.001-.002-.002-.002-.002-.001-.001Zm-5.106-1.089.001.001.002.002.002.002.001.001a.5.5 0 0 0 0 .707l1.373 1.372a.5.5 0 0 0 .707-.707l-1.372-1.372-.001-.001-.002-.002-.002-.002-.001-.001a.5.5 0 1 0 0-.707l1.372-1.372a.5.5 0 0 0-.707-.707L6.18 8.37a.5.5 0 0 0 0 .707Z"/></svg>',
                'PMC': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="link-icon"><path d="M4 0h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2zm0 1a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H4z"/><path d="M4.5 3.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5zm0 3a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5zm0 3a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5z"/></svg>',

                'PDF': '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="link-icon"><path d="M14 14V2a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2zM4 1h8a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1z"/><path d="M6 5.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5zm0 2a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5zm0 2a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5z"/></svg>'
            };
            return `<a href="${url}" target="_blank" class="btn btn-outline-secondary btn-sm me-1">${icon[label] || ''}${label}</a>`;
        }

        function generateLinks(item) {
            let linksHtml = '';
            if (item.source === 'PubMed') {
                linksHtml += createLink('PubMed', item.url); // item.url に修正
                linksHtml += createLink('DOI', item.doiUrl);
                linksHtml += createLink('PMC', item.pmcUrl);
            } else if (item.source === 'arXiv') {
                linksHtml += createLink('arXiv', item.url); // item.url に修正
                linksHtml += createLink('PDF', item.pdfUrl);
                linksHtml += createLink('DOI', item.doiUrl);
            }
            return linksHtml;
        }

        function toggleInputType() {
            const inputType = document.querySelector('input[name="inputType"]:checked').value;
            const keywordContainer = document.getElementById("keywordInputContainer");
            const urlContainer = document.getElementById("urlInputContainer");
            const maxPaperCountDiv = formElements.maxPaperCount.closest('.mb-3'); // maxPaperCountの親div
            const dateRangeDiv = formElements.startDate.closest('.row.g-2.mb-3'); // 日付範囲の親div

            if (inputType === "keyword") {
                keywordContainer.style.display = "block";
                urlContainer.style.display = "none";
                maxPaperCountDiv.style.display = "block"; // 表示
                dateRangeDiv.style.display = "flex"; // 表示 (flexboxなのでflex)

                formElements.searchWord.required = true;
                formElements.urlInput.required = false;
                formElements.maxPaperCount.required = true; // 必須にする
                formElements.startDate.required = false; // 日付は必須ではないが、念のため
                formElements.endDate.required = false; // 日付は必須ではないが、念のため
            } else { // inputType === "url"
                keywordContainer.style.display = "none";
                urlContainer.style.display = "block";
                maxPaperCountDiv.style.display = "none"; // 非表示
                dateRangeDiv.style.display = "none"; // 非表示

                formElements.searchWord.required = false;
                formElements.urlInput.required = true;
                formElements.maxPaperCount.required = false; // 必須ではない
                formElements.startDate.required = false;
                formElements.endDate.required = false;
            }
        }

        // フォーム要素を初期化する関数
        function initializeFormElements() {
            formElements = {
                searchWord: document.getElementById("searchWord"),
                sourceFlag: document.getElementById("sourceFlag"),
                startDate: document.getElementById("startDate"),
                endDate: document.getElementById("endDate"),
                maxPaperCount: document.getElementById("maxPaperCount"),
                language: document.getElementById("language"),
                sendEmailFlag: document.getElementById("sendEmailFlag"),
                email: document.getElementById("email"),
                urlInput: document.getElementById("urlInput") // 追加
            };
        }

        // 設定を読み込み、フォームに適用する関数
        function loadAndApplySettings() {
            loadSettings(); // localStorageから設定を読み込む
            toggleEmailInput(); // メール入力欄の表示を更新
        }

        // 初期日付を設定する関数
        function setInitialDates() {
            setDefaultDates(); // 日付をデフォルトに設定
        }

        window.onload = function() {
            try {
                initializeFormElements();
                loadAndApplySettings();
                setInitialDates();
            } catch (e) {
                console.error("Initialization error:", e);
                // エラーが発生した場合、ユーザーにメッセージを表示するなどのフォールバック処理
                document.body.innerHTML = '<div style="color: red; text-align: center; margin-top: 50px;">ページの読み込み中にエラーが発生しました。ブラウザのコンソールを確認してください。</div>';
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
